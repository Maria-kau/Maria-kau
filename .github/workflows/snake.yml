
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: maria-kau
          outputs: |
            dist/github-snake.svg?color_snake=%237c3aed&color_dots=%23ede9fe,%23ddd6fe,%23c4b5fd,%23a78bfa,%237c3aed
            dist/github-snake-dark.svg?color_snake=%23c084fc&color_dots=%231e1633,%234c1d95,%236d28d9,%238b5cf6,%23d8b4fe

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
